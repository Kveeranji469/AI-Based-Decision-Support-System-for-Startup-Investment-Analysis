<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Startup Success Prediction</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

min-height:100vh;

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

color:white;

}

/* NAVBAR */

nav{

width:100%;
height:70px;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 60px;

background:rgba(0,0,0,0.3);
backdrop-filter:blur(10px);

}

.logo{

font-size:24px;
font-weight:600;

}

.nav-buttons a{

text-decoration:none;

}

.nav-buttons button{

margin-left:15px;

padding:10px 22px;

border:none;
border-radius:30px;

background:#00c6ff;

color:white;

font-size:15px;

cursor:pointer;

transition:0.3s;

}

.nav-buttons button:hover{

background:#0072ff;
transform:scale(1.05);

}

/* MAIN */

.container{

height:80vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;

}

.container h1{

font-size:45px;
margin-bottom:20px;

}

.container p{

width:60%;
line-height:1.6;
font-size:18px;
opacity:0.9;

}

</style>

</head>

<body>

<nav>

<div class="logo">
Startup AI Predictor
</div>

<div class="nav-buttons">

<a href="/description">
<button>Project Description</button>
</a>

<a href="/startup">
<button>Startup Prediction</button>
</a>

</div>

</nav>


<div class="container">

<h1>Startup Success Prediction System</h1>

<p>
A machine learning based system that predicts the probability
of startup success using financial and business relationship data.
This tool helps investors and entrepreneurs evaluate the potential
success rate of startup ventures.
</p>

</div>

</body>
</html>
